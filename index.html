<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plánovač Rande</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen pb-12 font-sans">

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="min-h-screen bg-rose-50 flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl p-8 border border-rose-100 text-center">
      <div class="w-16 h-16 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
        <i class="fa-solid fa-heart"></i>
      </div>
      <h1 class="text-2xl font-bold text-gray-800 mb-2">Plánovač Rande</h1>
      <p class="text-gray-500 text-sm mb-6">Zadej své jméno pro vstup (Jirka nebo Terezka)</p>
      
      <form id="login-form" class="space-y-4">
        <div>
          <input
            type="text"
            id="login-input"
            placeholder="Tvoje jméno..."
            required
            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-rose-400 focus:border-transparent text-center font-medium"
          />
        </div>
        <p id="login-error" class="text-rose-500 text-xs font-semibold hidden"></p>
        <button
          type="submit"
          class="w-full bg-rose-500 hover:bg-rose-600 text-white font-semibold py-3 rounded-xl shadow-lg shadow-rose-200 transition duration-200"
        >
          Vstoupit
        </button>
      </form>
    </div>
  </div>

  <!-- MAIN APP SCREEN -->
  <div id="app-screen" class="hidden">
    <!-- Header -->
    <header class="bg-white border-b border-gray-100 sticky top-0 z-10 shadow-sm">
      <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <div class="bg-rose-500 p-2 rounded-xl text-white flex items-center justify-center w-9 h-9">
            <i class="fa-solid fa-heart"></i>
          </div>
          <span class="font-bold text-lg text-gray-800">Plánovač Rande</span>
        </div>
        
        <div class="flex items-center space-x-4">
          <div class="flex items-center space-x-2 bg-gray-100 px-3 py-1.5 rounded-full">
            <i class="fa-solid fa-user text-rose-500 text-xs"></i>
            <span id="user-display" class="text-sm font-medium"></span>
          </div>
          <button 
            id="logout-btn"
            class="text-gray-400 hover:text-gray-600 p-1 rounded-lg transition"
            title="Odhlásit se"
          >
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 pt-6">
      <!-- Actions -->
      <div class="flex flex-wrap gap-3 mb-6 items-center justify-between">
        <button
          id="toggle-add-btn"
          class="flex items-center space-x-2 bg-rose-500 hover:bg-rose-600 text-white px-4 py-2.5 rounded-xl font-medium shadow-md shadow-rose-100 transition"
        >
          <i class="fa-solid fa-plus"></i>
          <span>Přidat nápad od Jirky</span>
        </button>

        <button
          id="random-btn"
          class="flex items-center space-x-2 bg-purple-500 hover:bg-purple-600 text-white px-4 py-2.5 rounded-xl font-medium shadow-md shadow-purple-100 transition"
        >
          <i class="fa-solid fa-wand-magic-sparkles"></i>
          <span>Vylosovat rande</span>
        </button>
      </div>

      <!-- Add Form Modal/Box -->
      <div id="add-form-container" class="hidden mb-6 bg-white p-4 rounded-2xl border border-rose-100 shadow-sm">
        <h3 class="text-sm font-semibold text-gray-500 mb-2">Nový nápad (Autor: Jirka)</h3>
        <form id="add-idea-form" class="flex flex-col sm:flex-row gap-2">
          <input
            type="text"
            id="idea-text-input"
            placeholder="Co podnikneme?..."
            required
            class="flex-1 px-4 py-2 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-rose-400"
          />
          <div class="flex gap-2">
            <button
              type="submit"
              class="bg-rose-500 text-white px-4 py-2 rounded-xl font-medium hover:bg-rose-600 transition flex-1 sm:flex-none"
            >
              Uložit
            </button>
            <button
              type="button"
              id="cancel-add-btn"
              class="bg-gray-100 text-gray-500 px-4 py-2 rounded-xl font-medium hover:bg-gray-200 transition"
            >
              Zrušit
            </button>
          </div>
        </form>
      </div>

      <!-- Filters -->
      <div class="flex space-x-2 border-b border-gray-200 mb-6 pb-2 overflow-x-auto">
        <button data-filter="all" class="filter-btn px-3 py-1.5 rounded-lg text-sm font-medium transition whitespace-nowrap bg-white text-rose-500 shadow-sm border border-gray-100">
          Všechny
        </button>
        <button data-filter="pending" class="filter-btn px-3 py-1.5 rounded-lg text-sm font-medium transition whitespace-nowrap text-gray-500 hover:text-gray-700">
          Čeká na schválení
        </button>
        <button data-filter="approved" class="filter-btn px-3 py-1.5 rounded-lg text-sm font-medium transition whitespace-nowrap text-gray-500 hover:text-gray-700">
          Schválené
        </button>
        <button data-filter="rejected" class="filter-btn px-3 py-1.5 rounded-lg text-sm font-medium transition whitespace-nowrap text-gray-500 hover:text-gray-700">
          Zamítnuté
        </button>
      </div>

      <!-- Ideas List -->
      <div id="ideas-list" class="space-y-3">
        <!-- Generováno přes JS -->
      </div>
    </main>
  </div>

  <script>
    // App State
    let currentUser = localStorage.getItem('rande_user') || null;
    let currentFilter = 'all';
    
    // Default data if empty
    let ideas = JSON.parse(localStorage.getItem('rande_napady_jirka')) || [
      { id: 1, text: 'Piknik v parku s deskovkami', createdBy: 'Jirka', status: 'pending', date: '2026-08-01' },
      { id: 2, text: 'Návštěva únikové hry', createdBy: 'Jirka', status: 'approved', date: '2026-08-02' }
    ];

    // DOM Elements
    const loginScreen = document.getElementById('login-screen');
    const appScreen = document.getElementById('app-screen');
    const loginForm = document.getElementById('login-form');
    const loginInput = document.getElementById('login-input');
    const loginError = document.getElementById('login-error');
    const userDisplay = document.getElementById('user-display');
    const logoutBtn = document.getElementById('logout-btn');
    const toggleAddBtn = document.getElementById('toggle-add-btn');
    const addFormContainer = document.getElementById('add-form-container');
    const addIdeaForm = document.getElementById('add-idea-form');
    const ideaTextInput = document.getElementById('idea-text-input');
    const cancelAddBtn = document.getElementById('cancel-add-btn');
    const ideasList = document.getElementById('ideas-list');
    const randomBtn = document.getElementById('random-btn');
    const filterBtns = document.querySelectorAll('.filter-btn');

    // Init
    function init() {
      if (currentUser) {
        showApp();
      } else {
        showLogin();
      }
    }

    function saveIdeas() {
      localStorage.setItem('rande_napady_jirka', JSON.stringify(ideas));
    }

    function showLogin() {
      loginScreen.classList.remove('hidden');
      appScreen.classList.add('hidden');
    }

    function showApp() {
      loginScreen.classList.add('hidden');
      appScreen.classList.remove('hidden');
      userDisplay.textContent = currentUser;
      renderIdeas();
    }

    // Login logic
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const inputVal = loginInput.value.trim();
      const lowerVal = inputVal.toLowerCase();

      if (lowerVal === 'jirka') {
        currentUser = 'Jirka';
      } else if (lowerVal === 'terezka') {
        currentUser = 'Terezka';
      } else {
        loginError.textContent = 'Přístup povolen pouze pro Jirku a Terezku!';
        loginError.classList.remove('hidden');
        return;
      }

      loginError.classList.add('hidden');
      localStorage.setItem('rande_user', currentUser);
      showApp();
    });

    // Logout logic
    logoutBtn.addEventListener('click', () => {
      currentUser = null;
      localStorage.removeItem('rande_user');
      loginInput.value = '';
      showLogin();
    });

    // Toggle Add Form
    toggleAddBtn.addEventListener('click', () => {
      addFormContainer.classList.toggle('hidden');
      if (!addFormContainer.classList.contains('hidden')) {
        ideaTextInput.focus();
      }
    });

    cancelAddBtn.addEventListener('click', () => {
      addFormContainer.classList.add('hidden');
      ideaTextInput.value = '';
    });

    // Add New Idea
    addIdeaForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = ideaTextInput.value.trim();
      if (!text) return;

      const newIdea = {
        id: Date.now(),
        text: text,
        createdBy: 'Jirka', // Vždy natvrdo od Jirky
        status: 'pending',
        date: new Date().toISOString().split('T')[0]
      };

      ideas.unshift(newIdea);
      saveIdeas();
      renderIdeas();

      ideaTextInput.value = '';
      addFormContainer.classList.add('hidden');
    });

    // Filters
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => {
          b.className = "filter-btn px-3 py-1.5 rounded-lg text-sm font-medium transition whitespace-nowrap text-gray-500 hover:text-gray-700";
        });
        btn.className = "filter-btn px-3 py-1.5 rounded-lg text-sm font-medium transition whitespace-nowrap bg-white text-rose-500 shadow-sm border border-gray-100";
        
        currentFilter = btn.dataset.filter;
        renderIdeas();
      });
    });

    // Randomizer
    randomBtn.addEventListener('click', () => {
      const available = ideas.filter(i => i.status !== 'rejected');
      if (available.length === 0) {
        alert('Žádné dostupné nápady k vylosování!');
        return;
      }
      const random = available[Math.floor(Math.random() * available.length)];
      alert(`Dnešní rande: ${random.text}! 💕`);
    });

    // Item Actions (Status, Delete)
    window.changeStatus = function(id, status) {
      ideas = ideas.map(idea => idea.id === id ? { ...idea, status } : idea);
      saveIdeas();
      renderIdeas();
    };

    window.deleteIdea = function(id) {
      ideas = ideas.filter(idea => idea.id !== id);
      saveIdeas();
      renderIdeas();
    };

    // Render List
    function renderIdeas() {
      const filtered = ideas.filter(idea => {
        if (currentFilter === 'pending') return idea.status === 'pending';
        if (currentFilter === 'approved') return idea.status === 'approved';
        if (currentFilter === 'rejected') return idea.status === 'rejected';
        return true;
      });

      if (filtered.length === 0) {
        ideasList.innerHTML = `
          <div class="text-center py-12 bg-white rounded-2xl border border-dashed border-gray-200">
            <i class="fa-solid fa-compass text-4xl text-gray-300 mb-2"></i>
            <p class="text-gray-500">Žádné nápady v této kategorii.</p>
          </div>
        `;
        return;
      }

      ideasList.innerHTML = filtered.map(idea => {
        let statusHtml = '';
        if (idea.status === 'pending') {
          statusHtml = `
            <div class="flex items-center space-x-1">
              <button onclick="changeStatus(${idea.id}, 'approved')" class="p-2 bg-green-50 text-green-600 rounded-xl hover:bg-green-100 transition" title="Schválit">
                <i class="fa-solid fa-check"></i>
              </button>
              <button onclick="changeStatus(${idea.id}, 'rejected')" class="p-2 bg-rose-50 text-rose-600 rounded-xl hover:bg-rose-100 transition" title="Zamítnout">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
          `;
        } else if (idea.status === 'approved') {
          statusHtml = `
            <span class="flex items-center space-x-1 bg-green-100 text-green-700 text-xs px-2.5 py-1 rounded-full font-medium">
              <i class="fa-solid fa-circle-check"></i>
              <span>Schváleno</span>
            </span>
          `;
        } else if (idea.status === 'rejected') {
          statusHtml = `
            <span class="flex items-center space-x-1 bg-gray-100 text-gray-500 text-xs px-2.5 py-1 rounded-full font-medium">
              <i class="fa-solid fa-circle-xmark"></i>
              <span>Zamítnuto</span>
            </span>
          `;
        }

        return `
          <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm flex items-center justify-between gap-4">
            <div class="flex-1">
              <div class="flex items-center space-x-2 mb-1">
                <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-blue-50 text-blue-600">
                  Jirka
                </span>
                <span class="text-xs text-gray-400">${idea.date}</span>
              </div>
              <p class="text-gray-800 font-medium">${idea.text}</p>
            </div>

            <div class="flex items-center space-x-2">
              ${statusHtml}
              <button onclick="deleteIdea(${idea.id})" class="p-2 text-gray-300 hover:text-rose-500 transition rounded-xl" title="Smazat">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Run app
    init();
  </script>
</body>
</html>
