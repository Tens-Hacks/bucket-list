<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Náš Love & Future Bucket List</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Pro Ikony -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top left, #1a0b2e, #090514);
            color: #f3e8ff;
            min-height: 100vh;
        }

        /* Glassmorphism styling */
        .glass-panel {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(244, 114, 182, 0.15);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            border-color: rgba(244, 114, 182, 0.4);
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.2);
            transform: translateY(-2px);
        }

        .neon-glow {
            text-shadow: 0 0 10px rgba(236, 72, 153, 0.6), 0 0 20px rgba(168, 85, 247, 0.4);
        }

        .neon-btn {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.4);
            transition: all 0.3s ease;
        }

        .neon-btn:hover {
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.7);
            transform: scale(1.02);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #090514;
        }
        ::-webkit-scrollbar-thumb {
            background: #3b0764;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ec4899;
        }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center justify-start relative overflow-x-hidden">

    <!-- Glowing Background Orbs -->
    <div class="fixed top-[-10%] left-[-10%] w-[400px] h-[400px] bg-pink-600/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[400px] h-[400px] bg-purple-600/20 rounded-full blur-[120px] pointer-events-none"></div>

    <!-- Login Modal Section -->
    <div id="login-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md">
        <div class="glass-panel p-8 rounded-3xl max-w-md w-full mx-4 text-center border border-pink-500/30">
            <div class="w-16 h-16 bg-pink-500/20 rounded-full flex items-center justify-center mx-auto mb-4 border border-pink-500/40">
                <i class="fa-solid fa-heart text-pink-500 text-2xl animate-pulse"></i>
            </div>
            <h2 class="text-3xl font-bold mb-2 neon-glow bg-clip-text text-transparent bg-gradient-to-r from-pink-400 to-purple-400">Vítejte!</h2>
            <p class="text-gray-400 mb-6 text-sm">Kdo si prohlíží nebo přidává plány?</p>
            
            <div class="space-y-4">
                <input type="text" id="username-input" placeholder="Zadej své jméno..." class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 focus:outline-none focus:border-pink-500 transition">
                <button onclick="login()" class="w-full py-3 rounded-xl neon-btn font-bold text-white tracking-wide">Vstoupit do Bucket Listu</button>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="max-w-4xl w-full">

        <!-- Header -->
        <header class="glass-panel rounded-3xl p-6 mb-8 flex flex-col md:flex-row justify-between items-center gap-4 border border-pink-500/20">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-pink-500 to-purple-600 flex items-center justify-center shadow-lg shadow-pink-500/30">
                    <i class="fa-solid fa-[#000] fa-heart text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-pink-400 via-purple-300 to-indigo-400 neon-glow">
                        Náš Společný Bucket List
                    </h1>
                    <p class="text-xs text-pink-300/70 font-medium">Karlovarsko & Naše dobrodružství 2026</p>
                </div>
            </div>

            <div id="user-info" class="flex items-center gap-3 bg-white/5 px-4 py-2 rounded-2xl border border-white/10">
                <span class="text-sm text-gray-300">Přihlášen: <strong id="current-user-display" class="text-pink-400">...</strong></span>
                <button onclick="logout()" class="text-gray-400 hover:text-pink-400 transition text-sm ml-2" title="Odhlásit">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </header>

        <!-- New Item Form -->
        <section class="glass-panel rounded-3xl p-6 mb-8 border border-purple-500/20">
            <h3 class="text-lg font-semibold mb-4 text-pink-300 flex items-center gap-2">
                <i class="fa-solid fa-plus-circle"></i> Přidat nový cíl / aktivitu
            </h3>
            <form id="add-todo-form" onsubmit="handleAddTodo(event)" class="grid grid-cols-1 md:grid-cols-12 gap-4">
                <div class="md:col-span-5">
                    <input type="text" id="todo-text" placeholder="Co podnikneme? (např. Východ slunce na Dianě)" required
                        class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 focus:outline-none focus:border-pink-500 transition">
                </div>
                <div class="md:col-span-4">
                    <input type="date" id="todo-date" required
                        class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white focus:outline-none focus:border-pink-500 transition">
                </div>
                <div class="md:col-span-3">
                    <button type="submit" class="w-full h-full py-3 rounded-xl neon-btn font-bold text-white flex items-center justify-center gap-2">
                        <i class="fa-solid fa-sparkles"></i> Uložit
                    </button>
                </div>
            </form>
        </section>

        <!-- Bucket List Section -->
        <section class="space-y-4">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-calendar-heart text-pink-500"></i> Naše plány
                </h2>
                <span id="todo-count" class="text-xs px-3 py-1 rounded-full bg-pink-500/20 text-pink-300 border border-pink-500/30">0 položek</span>
            </div>

            <div id="todo-list" class="space-y-3">
                <!-- Dynamicky generováno pomocí JS -->
            </div>
        </section>

    </div>

    <script>
        // Výchozí nápady pro Karlovarský kraj
        const defaultIdeas = [
            { id: 1, text: "🌅 Východ slunce na rozhledně Diana s kávou", date: "2026-08-15", author: "Systém", completed: false },
            { id: 2, text: "🚣 Sjezd Ohře na kanoích (Loket -> Karlovy Vary)", date: "2026-08-22", author: "Systém", completed: false },
            { id: 3, text: "🏰 Západ slunce a večerní piknik u hradu Loket", date: "2026-08-28", author: "Systém", completed: false },
            { id: 4, text: "🌲 Romantická procházka kolem rybníka Kladská", date: "2026-09-05", author: "Systém", completed: false },
            { id: 5, text: "🌌 Pozorování hvězd na Božím Daru", date: "2026-09-08", author: "Systém", completed: false },
            { id: 6, text: "✈️ Rozlučkový večer před odletem do Egypta", date: "2026-09-09", author: "Systém", completed: false },
            { id: 7, text: "🇪🇬 Přítelkyně užívá Egypt! 🏝️", date: "2026-09-10", author: "Systém", completed: false },
            { id: 8, text: "☕ Oslavný kavárenský maraton v KV po návratu", date: "2026-09-22", author: "Systém", completed: false },
            { id: 9, text: "🎓 Příprava na start VŠ & společný relax", date: "2026-09-28", author: "Systém", completed: false }
        ];

        let currentUser = localStorage.getItem('bucket_user') || '';
        let todos = JSON.parse(localStorage.getItem('bucket_todos')) || defaultIdeas;

        // Inicilalizace při načtení
        window.onload = function() {
            if (currentUser) {
                document.getElementById('login-modal').classList.add('hidden');
                document.getElementById('current-user-display').innerText = currentUser;
            } else {
                document.getElementById('login-modal').classList.remove('hidden');
            }
            renderTodos();
        };

        function login() {
            const input = document.getElementById('username-input').value.trim();
            if (input) {
                currentUser = input;
                localStorage.setItem('bucket_user', currentUser);
                document.getElementById('current-user-display').innerText = currentUser;
                document.getElementById('login-modal').classList.add('hidden');
            }
        }

        function logout() {
            localStorage.removeItem('bucket_user');
            currentUser = '';
            document.getElementById('login-modal').classList.remove('hidden');
        }

        function handleAddTodo(e) {
            e.preventDefault();
            const textInput = document.getElementById('todo-text');
            const dateInput = document.getElementById('todo-date');

            const newTodo = {
                id: Date.now(),
                text: textInput.value.trim(),
                date: dateInput.value,
                author: currentUser,
                completed: false
            };

            todos.push(newTodo);
            saveAndRender();

            textInput.value = '';
            dateInput.value = '';
        }

        function toggleComplete(id) {
            todos = todos.map(todo => {
                if (todo.id === id) {
                    return { ...todo, completed: !todo.completed };
                }
                return todo;
            });
            saveAndRender();
        }

        function deleteTodo(id) {
            todos = todos.filter(todo => todo.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            // Řazení podle data
            todos.sort((a, b) => new Date(a.date) - new Date(b.date));
            localStorage.setItem('bucket_todos', JSON.stringify(todos));
            renderTodos();
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const [year, month, day] = dateStr.split('-');
            return `${day}. ${month}. ${year}`;
        }

        function renderTodos() {
            const listEl = document.getElementById('todo-list');
            const countEl = document.getElementById('todo-count');
            listEl.innerHTML = '';

            countEl.innerText = `${todos.length} položek`;

            if (todos.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-12 text-gray-500 glass-card rounded-2xl">
                        <i class="fa-regular fa-heart text-4xl mb-3 text-pink-500/30"></i>
                        <p>Zatím zde nemáte žádné plány. Přidejte první!</p>
                    </div>
                `;
                return;
            }

            todos.forEach(todo => {
                const card = document.createElement('div');
                card.className = `glass-card p-4 rounded-2xl flex items-center justify-between gap-4 ${todo.completed ? 'opacity-50' : ''}`;

                card.innerHTML = `
                    <div class="flex items-center gap-4 flex-1">
                        <button onclick="toggleComplete(${todo.id})" class="w-7 h-7 rounded-xl border border-pink-500/40 flex items-center justify-center transition ${todo.completed ? 'bg-pink-500 text-white' : 'hover:border-pink-500'}">
                            ${todo.completed ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                        </button>
                        <div class="flex-1">
                            <p class="font-medium ${todo.completed ? 'line-through text-gray-400' : 'text-white'}">${todo.text}</p>
                            <div class="flex items-center gap-3 text-xs text-gray-400 mt-1">
                                <span class="text-pink-300/80"><i class="fa-regular fa-calendar text-pink-500"></i> ${formatDate(todo.date)}</span>
                                <span>•</span>
                                <span><i class="fa-regular fa-user text-purple-400"></i> ${todo.author}</span>
                            </div>
                        </div>
                    </div>
                    <button onclick="deleteTodo(${todo.id})" class="text-gray-500 hover:text-red-400 transition p-2" title="Smazat">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                `;

                listEl.appendChild(card);
            });
        }
    </script>
</body>
</html>
